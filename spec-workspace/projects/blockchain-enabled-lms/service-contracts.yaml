---
# Runtime service-to-service dependency manifest for Blockchain-Enabled LMS.
#
# Decision D-4: separated from binding.yaml. binding.yaml is the specification
# pointer (spec-workspace/AGENTS.md Section 4); this file is the service
# binding manifest.
#
# Authority: SRS_LMS_v1.0.md Section 3 defines the seven service domains and is
# authoritative. This file records the RUNTIME BINDINGS between them, which are
# an implementation concern. Where the two disagree, the SRS governs.
#
# The three service bindings below were authored by the concurrent authoring
# session on 2026-11-13 (09:34:52) and preserved verbatim. The domain list is
# reconciled against SRS Section 3.1 (finding R-14): all seven domains are now
# declared, and the ones without a runtime binding yet are marked explicitly
# rather than omitted.
services:
  auth-service:
    domain: IAM
    provides: user.profile
    requires: core-identity-module
    binding_status: declared

  record-schema:
    domain: LGS
    provides: blockchain.record
    requires: data-persistence-layer
    binding_status: declared

  blockchain-gateway:
    domain: unresolved
    provides: immutable-event-pointer
    requires: network-client-sdk
    binding_status: declared
    note: >-
      The SRS defines no gateway domain among its seven. The gateway role is
      distributed: LGS commits the proof and IAM authorizes the actor, so this
      service's place in the domain model is not yet decided. Two candidate
      directory names exist in the repository (lms-platform/blockchain-proxy,
      lms-platform/web-api-gateway) and neither is an SRS domain. Requires a
      human decision - see SRS Question Q-6 and ledger WORK-037.

# The seven service domains declared by SRS_LMS_v1.0.md Section 3.1.
domains:
  - domain: IAM
    binding_status: declared
  - domain: ECS
    binding_status: not-yet-specified
    note: Rule authority. No runtime binding specified yet.
  - domain: AMS
    binding_status: not-yet-specified
    note: Course and program definitions. No runtime binding specified yet.
  - domain: FRAS
    binding_status: not-yet-specified
    note: Instructional allocation and instructor load. Capacity constraints are defined by ECS and enforced by ESS (SRS 3.3). No runtime binding specified yet.
  - domain: ESS
    binding_status: not-yet-specified
    note: Sections and enrollments. No runtime binding specified yet.
  - domain: GRA-Service
    binding_status: not-yet-specified
    note: Grading and appeals. No runtime binding specified yet.
  - domain: LGS
    binding_status: declared

# No domain is unmapped against the SRS - the gap is in the runtime bindings,
# not in the domain model. Which domains need a runtime binding before the
# first implementation slice is decided by the implementation plan.
unmapped_srs_domains: []
